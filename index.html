<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng văn bản với HTML Styles</title>
</head>
<body>

    <!-- Tiêu đề h1 màu xanh dương -->
    <h1 style="color: blue;">Bài viết của tôi</h1>

    <!-- Đoạn văn màu đỏ, chữ in đậm -->
    <p style="color: red; font-weight: bold;">Đầy là đoạn văn được định dạng màu sắc.</p>

    <!-- Đoạn văn chữ in nghiêng, căn giữa -->
    <p style="font-style: italic; text-align: center;">Tôi đang học HTML Styles.</p>

    <!-- Đoạn văn kích thước 20px, gạch chân -->
    <p style="font-size: 20px; text-decoration: underline;">Định dạng văn bản giúp trang web đẹp hơn.</p>

</body>
</html>
