<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- Thẻ <img> dùng để hiển thị hình ảnh -->
    <!-- src: đường dẫn đến ảnh (file local hoặc link online) -->
    <!-- alt: chữ mô tả hình ảnh (hiển thị khi ảnh bị lỗi) -->
    <img src="https://picsum.photos/400/300" alt="Hình ảnh thiên nhiên đẹp" width="400">

</body>
</html>
